# Full local stack: Postgres + the app.
#   export JWT_SECRET=$(openssl rand -base64 48)   # never commit this
#   docker compose up -d --build
# Host ports: app 7300, postgres 55460. The Postgres password default is a throwaway local value.
name: shipflow

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: shipflow
    ports:
      - "127.0.0.1:${PG_PORT:-55460}:5432"
    configs:
      - source: init-db
        target: /docker-entrypoint-initdb.d/10-init.sql
    volumes:
      - shipflow-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    image: shipflow:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/shipflow
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-}   # required; the app refuses to start without one
      JWT_ISSUER: ${JWT_ISSUER:-shipflow-local}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-json}
      JAVA_TOOL_OPTIONS: "-Xmx512m -XX:+ExitOnOutOfMemoryError"
    ports:
      - "127.0.0.1:${APP_PORT:-7300}:8080"
    stop_grace_period: 30s
    mem_limit: 900m

configs:
  # extra databases for the ITs and the benchmark (inline, so it also works with a remote docker daemon)
  init-db:
    content: |
      CREATE DATABASE shipflow_test;
      CREATE DATABASE shipflow_bench;

volumes:
  shipflow-pg:
